services:
  db:
    image: postgres:16
    restart: unless-stopped
    hostname: db
    expose:
      - 5432
    ports:
      - ${DJANGO_POSTGRES_PORT:-65432}:5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    env_file:
      - ./.env
    volumes:
      - bridge_db:/var/lib/postgresql/data/
  web:
    build:
      context: .
    image: mstarman/shuttlebuilder:0.2.21
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_started
    environment:
      - POSTGRES_PORT=5432
      - POSTGRES_HOST=db
    env_file:
      - ./.env
    ports:
      - 3222:80
  redis:
    image: redis:8.8.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
volumes:
  bridge_db:
