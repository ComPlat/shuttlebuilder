x-postgress-variables: &postgress-variables
  POSTGRES_DB: "${POSTGRES_DB:-postgres}"
  POSTGRES_USER: "${POSTGRES_USER:-postgres}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"

x-envs: &envs
  MODE: prod
  ALLOWED_HOST: "${ALLOWED_HOST}"
  ELN_URL: "${ELN_URL}"
  DJANGO_SUPERUSER_USERNAME: "${DJANGO_SUPERUSER_USERNAME}"
  DJANGO_SUPERUSER_EMAIL: "${DJANGO_SUPERUSER_EMAIL}"
  DJANGO_SUPERUSER_PASSWORD: "${DJANGO_SUPERUSER_PASSWORD}"
  POSTGRES_PORT: 5432
  POSTGRES_HOST: db
  EMAIL_PORT: "${EMAIL_PORT}"
  EMAIL_HOST: "${EMAIL_HOST}"
  EMAIL_HOST_USER: "${EMAIL_HOST_USER}"
  EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD}"
  SDC_AI_PROVIDER: "${SDC_AI_PROVIDER:-anthropic}"
  SDC_AI_MODEL: "${SDC_AI_MODEL:-claude-opus-5-5}"
  SDC_AI_BASE_URL: "${SDC_AI_BASE_URL:-}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
  # Signs sessions and tokens; without it the public development key is used (a warning is logged).
  DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-}"
  CHEMASSISTENT_URL: "${CHEMASSISTENT_URL:-}"
  SHUTTLE_BUILD_TIMEOUT: "${SHUTTLE_BUILD_TIMEOUT:-600}"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    hostname: db
    expose:
      - 5432
    ports:
      - ${PROJECT_POSTGRES_PORT:-65432}:5432
    environment:
      <<: *postgress-variables
    volumes:
      - bridge_db:/var/lib/postgresql/data/
  broadcaster:
    image: mstarman/shuttlebuilder_broadcaster:0.1.1
    build:
      context: .
      dockerfile: ./broadcaster.Dockerfile
    network_mode: host
    restart: unless-stopped
    environment:
       PUBLIC_IP_URL: ${PUBLIC_IP_URL}
  web:
    image: mstarman/shuttlebuilder:0.2.20
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_started

    environment:
      <<:
        - *envs
        - *postgress-variables
    ports:
      - ${PROJECT_WEB_PORT:-80}:80
    volumes:
      # Uploaded converter profiles and server certificates (lost on every container rebuild without it).
      - shuttle_media:/opt/media

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}"
    ports:
      - "8080:80"
    depends_on:
      - db

  redis:
    image: redis:8.8.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s


volumes:
  bridge_db:
  shuttle_media:
