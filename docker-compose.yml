x-postgress-variables: &postgress-variables
  POSTGRES_DB: "${POSTGRES_DB:-postgres}"
  POSTGRES_USER: "${POSTGRES_USER:-postgres}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-q3opc3123§§!'urbn$5(#6}"

x-envs: &envs
  MODE: prod
  ALLOWED_HOST: "${ALLOWED_HOST}"
  ELN_URL: "${ELN_URL}"
  DJANGO_SUPERUSER_USERNAME: "${DJANGO_SUPERUSER_USERNAME}"
  DJANGO_SUPERUSER_EMAIL: "${DJANGO_SUPERUSER_EMAIL}"
  DJANGO_SUPERUSER_PASSWORD: "${DJANGO_SUPERUSER_PASSWORD}"
  POSTGRES_PORT: 5432
  POSTGRES_HOST: db
  EMAIL_PORT: "${EMAIL_PORT}"
  EMAIL_HOST: "${EMAIL_HOST}"
  EMAIL_HOST_USER: "${EMAIL_HOST_USER}"
  EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD}"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    hostname: db
    expose:
      - 5432
    ports:
      - ${PROJECT_POSTGRES_PORT:-65432}:5432
    environment:
      <<: *postgress-variables
    volumes:
      - bridge_db:/var/lib/postgresql/data/
  broadcaster:
    image: mstarman/shuttlebuilder_broadcaster:0.1.1
    build:
      context: .
      dockerfile: ./broadcaster.Dockerfile
    network_mode: host
    restart: unless-stopped
    environment:
       PUBLIC_IP_URL: ${PUBLIC_IP_URL}
  web:
    image: mstarman/shuttlebuilder:0.2.19
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_started

    environment:
      <<:
        - *envs
        - *postgress-variables
    ports:
      - ${PROJECT_WEB_PORT:-80}:80

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: asetvbj!nm345vawectr32
    ports:
      - "8080:80"
    depends_on:
      - db

  redis:
    image: redis:8.8.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s


volumes:
  bridge_db:
